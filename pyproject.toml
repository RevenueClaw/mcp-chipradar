[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-chipradar"
version = "0.2.2"
description = "MCP server for the ChipRadar hardware pricing API"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
  {name = "ChipRadar", email = "dev@chipradar.io"}
]
keywords = ["mcp", "chipradar", "hardware", "pricing", "sbc"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
  "httpx>=0.27",
  "mcp>=1.12.0,<2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]

[project.urls]
Homepage = "https://chipradar.io/developers"
Repository = "https://github.com/RevenueClaw/mcp-chipradar"
Issues = "https://github.com/RevenueClaw/mcp-chipradar/issues"

[project.scripts]
mcp-chipradar = "mcp_chipradar.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
